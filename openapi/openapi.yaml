openapi: 3.0.3
info:
  title: ESR Mobile & REST API
  version: 1.0.0
  description: Auto-generated from `npm run mobile:api`. Covers esr-web-frontend
    `/api/*` and Flask JSON routes. MY-esr duplicate folder is excluded.
    Authenticate with Bearer JWT from Supabase or `POST /api/auth/login`.
servers:
  - url: https://esr-web-frontend.vercel.app
    description: Production (Next.js)
  - url: http://localhost:3000
    description: Local Next.js
  - url: https://esr-flask-admin.vercel.app
    description: Flask JSON (if deployed)
  - url: http://localhost:5000
    description: Local Flask admin
tags:
  - name: Auth
    description: Login, signup, token refresh
  - name: Profile
  - name: Me
    description: Current user vouchers & reviews
  - name: Devices
    description: Push token registration
  - name: Restaurants
  - name: Offers
  - name: Coupons
  - name: Reviews
  - name: Wishlist
  - name: Feed
  - name: Ads
  - name: Admin
    description: Admin or owner role required
  - name: Meta
  - name: Flask
    description: esr-flask-admin JSON endpoints
  - name: API
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase access_token
    flaskSession:
      type: apiKey
      in: cookie
      name: session
      description: Flask admin session after HTML login
  schemas:
    Error: &a2
      type: object
      properties:
        error:
          type: string
    JsonObject: &a1
      type: object
      additionalProperties: true
paths:
  /api/admin/analytics:
    get:
      summary: Admin analytics KPIs
      description: "Mobile-ready REST endpoint. Send `Authorization: Bearer
        <access_token>` when security is required."
      tags:
        - Admin
      security: &a3
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: *a1
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: *a2
      x-admin-only: true
